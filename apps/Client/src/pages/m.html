<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

      const nums = [1, 2, 3, 4, 6, 8];
const target = 10;
const hash = {};

for (let i = 0; i < nums.length; i++) {
    const complement = target - nums[i];

    if (complement in hash) {
        console.log("Indices:", [hash[complement], i]);
        console.log("Values:", [nums[hash[complement]], nums[i]]);
        break;
    }

    hash[nums[i]] = i;
}

    </script>

</body>
</html>
